<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Inventario</title>
<style>
:root{--g:#1c4a3a;--g2:#2a6a54;--bg:#faf8f3;--card:#fffefb;--line:#e6e2d6;--tx:#17302a;--mu:#7b8780;--or:#f2845c;--sel:#efecd9;--red:#c2543a}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:248px;background:var(--g);color:#e8efe9;padding:26px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:30px}.logo i{width:38px;height:38px;border-radius:10px;background:var(--or);display:grid;place-items:center;font-style:normal;font-size:20px}
.logo b{font-size:17px;display:block}.logo small,.eyebrow{font:11px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#9db8aa}
nav{margin-top:12px}nav a{display:block;padding:11px 14px;border-radius:10px;color:#e8efe9;text-decoration:none;font-weight:600;margin-bottom:6px;cursor:pointer}
nav a.on{background:var(--sel);color:var(--g)}.saved{margin-top:auto;border:1px solid #3b6b59;border-radius:12px;padding:12px;font-size:12px}.saved b{display:block;margin-bottom:4px}
main{flex:1;min-width:0}header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:var(--mu)}
#v{max-width:1180px;margin:0 auto;padding:36px 40px 60px}.eyebrow{color:var(--mu)}
h1{font-size:38px;margin:8px 0 4px;letter-spacing:-.03em}.sub{color:var(--mu);margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.btn{border:1px solid var(--line);background:#f1efe5;color:var(--tx);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.btn.p{background:var(--g);color:#fff;border-color:var(--g)}.btn.d{color:var(--red)}.btn.s{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.card h3{margin:0 0 2px;font-size:17px}.card .mu,.mu{color:var(--mu);font-size:12px}
.kpi b{display:block;font-size:30px;margin:10px 0 2px}.kpi.pos b{color:var(--g2)}.kpi.neg b{color:var(--red)}
table{width:100%;border-collapse:collapse}th{font:11px ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid #f0ede2;vertical-align:middle}tr:last-child td{border:0}.r{text-align:right}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx);width:100%}.tools input[type=text],.tools input:not([type]){width:290px}.tools select,.tools input[type=date]{width:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#e3efe7;color:var(--g2)}.tag.v{background:#dbe6e1;color:var(--g)}.tag.c{background:#f6e3d8;color:#b3552f}.tag.w{background:#f8dcd3;color:var(--red)}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
#modal{position:fixed;inset:0;background:#0b241c88;display:none;place-items:center;z-index:9}#modal.on{display:grid}
.box{background:var(--card);border-radius:18px;padding:26px;width:520px;max-width:94vw;max-height:92vh;overflow:auto}.box h2{margin:0 0 16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{font-size:12px;font-weight:600;color:var(--mu);display:block}.f label input,.f label select{margin-top:4px;color:var(--tx);font-weight:400}.f .w{grid-column:1/-1}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede2}.rank:last-child{border:0}
.n{width:30px;height:30px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-weight:800;color:var(--g)}.rank:nth-child(1) .n{background:#f5d76e}.rank:nth-child(2) .n{background:#d9dde0}.rank:nth-child(3) .n{background:#e6b98f}
.bar{height:7px;background:#ece9dc;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:9px}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}aside{width:200px}#v{padding:24px}}
@media print{aside,header,.btn,.tools{display:none}}
</style></head><body>
<aside><div class="logo"><i>🧺</i><div><b>Control de</b><small>Inventario local</small></div></div>
<div class="eyebrow">Tu negocio</div>
<nav><a data-r="inicio">▦ Inicio</a><a data-r="productos">🛍 Productos</a><a data-r="movimientos">🧾 Movimientos</a><a data-r="analisis">📈 Análisis y Top</a></nav>
<div class="saved"><b>● Guardado en este equipo</b>Tus datos están disponibles sin conexión.<div style="margin-top:8px;display:flex;gap:6px"><button class="btn s" onclick="backup()">Respaldo</button><button class="btn s" onclick="restore()">Restaurar</button></div></div></aside>
<main><header><span id="fecha"></span><span>● Modo sin conexión</span></header><section id="v"></section></main>
<div id="modal"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s);
const KEY='inv_prendas_v1';
let db={products:[],moves:[]};
try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudo guardar')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>'S/ '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${p.name}${p.size?' · '+p.size:''}`:'(eliminado)';
const sales=()=>db.moves.filter(m=>m.type==='venta');
$('#fecha').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());

function empty(t,s,btn){return `<div class="empty"><b>${t}</b>${s}${btn?'<div style="margin-top:14px">'+btn+'</div>':''}</div>`}
function head(eb,t,s,acts=''){return `<div class="top"><div><div class="eyebrow">${eb}</div><h1>${t}</h1><p class="sub">${s}</p></div><div>${acts}</div></div>`}
const mBtns=`<button class="btn" onclick="moveForm('compra')">↙ Registrar compra</button> <button class="btn p" onclick="moveForm('venta')">↗ Registrar venta</button>`;

const views={
inicio(){
 const P=db.products,units=P.reduce((a,p)=>a+p.stock,0),val=P.reduce((a,p)=>a+p.stock*p.cost,0),low=P.filter(p=>p.stock<=p.min);
 const hoy=db.moves.filter(m=>m.date===today()).length,rec=[...db.moves].reverse().slice(0,6);
 return head('Vista general / '+today(),'El pulso de tu tienda.','Un vistazo claro a lo que tienes y a lo que se mueve.',mBtns)+
 `<div class="grid"><div class="card kpi"><span class="mu">Productos activos</span><b>${P.length}</b><span class="mu">Referencias en tu catálogo</span></div>
 <div class="card kpi"><span class="mu">Unidades disponibles</span><b>${units}</b><span class="mu">Sumadas entre todos tus productos</span></div>
 <div class="card kpi"><span class="mu">Valor de inventario</span><b>${money(val)}</b><span class="mu">A precio de costo</span></div>
 <div class="card kpi ${low.length?'neg':''}"><span class="mu">Por reponer</span><b>${low.length}</b><span class="mu">${low.length?'En mínimo o por debajo':'Todo está sobre el mínimo'}</span></div></div>
 <div class="g2"><div class="card"><div style="display:flex;justify-content:space-between"><div><h3>Actividad reciente</h3><span class="mu">Compras y ventas registradas</span></div><button class="btn s" onclick="go('movimientos')">Ver historial</button></div>
 ${rec.length?`<table style="margin-top:10px">${rec.map(m=>`<tr><td><span class="tag ${m.type==='venta'?'v':'c'}">${m.type}</span></td><td>${esc(pname(prod(m.pid)))}</td><td class="r">${m.qty} u.</td><td class="r">${money(m.qty*m.unit)}</td></tr>`).join('')}</table>`:empty('Aún no hay actividad','Cuando registres una compra o una venta, aparecerá aquí.')}</div>
 <div class="card"><div style="display:flex;justify-content:space-between"><div><h3>Necesitan atención</h3><span class="mu">En mínimo o por debajo</span></div><span class="tag">${low.length} productos</span></div>
 ${low.length?low.map(p=>`<div class="rank" style="grid-template-columns:1fr auto"><div>${esc(pname(p))}<div class="mu">Mínimo ${p.min}</div></div><span class="tag w">${p.stock} u.</span></div>`).join(''):empty('Todo en orden','Agrega productos y define su stock mínimo para recibir avisos.')}</div></div>
 <div class="card" style="padding:12px 18px;display:flex;justify-content:space-between" ><span class="mu">Hoy llevas <b>${hoy}</b> movimientos registrados.</span><span class="mu">Los cambios se guardan automáticamente en este equipo.</span></div>`},

productos(){
 const q=(window.pq||'').toLowerCase(),c=window.pc||'';
 const cats=[...new Set(db.products.map(p=>p.cat).filter(Boolean))].sort();
 const L=db.products.filter(p=>(!c||p.cat===c)&&(`${p.name} ${p.code} ${p.cat}`.toLowerCase().includes(q)));
 return head(`Catálogo / ${db.products.length} referencias`,'Productos','Cuida cada referencia y mantén tus cuentas al día.',`<button class="btn p" onclick="prodForm()">＋ Nuevo producto</button>`)+
 `<div class="card"><div class="tools"><input placeholder="Buscar por nombre, código o categoría" value="${esc(window.pq||'')}" oninput="pq=this.value;keep('productos')"><select onchange="pc=this.value;render()"><option value="">Todas</option>${cats.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}</select><span class="mu" style="margin-left:auto">${L.length} resultados</span></div>
 ${L.length?`<table><tr><th>Código</th><th>Prenda</th><th>Categoría</th><th>Talla</th><th class="r">Costo</th><th class="r">Precio</th><th class="r">Stock</th><th></th></tr>${L.map(p=>`<tr><td class="mu">${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.cat)}</td><td>${esc(p.size)}</td><td class="r">${money(p.cost)}</td><td class="r">${money(p.price)}</td><td class="r"><span class="tag ${p.stock<=p.min?'w':''}">${p.stock}</span></td><td class="r"><button class="btn s" onclick="prodForm('${p.id}')">Editar</button> <button class="btn s d" onclick="delProd('${p.id}')">✕</button></td></tr>`).join('')}</table>`:empty('Tu catálogo empieza aquí','Agrega las prendas que vendes. Define costo, precio y un mínimo para saber cuándo reponer.','<button class="btn p" onclick="prodForm()">＋ Agregar primer producto</button>')}</div>`},

movimientos(){
 const q=(window.mq||'').toLowerCase(),t=window.mt||'',d=window.md||'';
 const L=[...db.moves].reverse().filter(m=>(!t||m.type===t)&&(!d||m.date===d)&&(`${pname(prod(m.pid))} ${m.party}`.toLowerCase().includes(q)));
 return head(`Registro / ${db.moves.length} movimientos`,'Movimientos','Cada entrada y salida, con el stock actualizado al instante.',`<button class="btn" onclick="moveForm('compra')">↙ Compra</button> <button class="btn p" onclick="moveForm('venta')">↗ Venta</button>`)+
 `<div class="card"><div class="tools"><input placeholder="Producto, proveedor o cliente" value="${esc(window.mq||'')}" oninput="mq=this.value;keep('movimientos')"><select onchange="mt=this.value;render()"><option value="">Todos los tipos</option><option value="compra" ${t==='compra'?'selected':''}>Compras</option><option value="venta" ${t==='venta'?'selected':''}>Ventas</option></select><input type="date" value="${d}" onchange="md=this.value;render()"><span class="mu" style="margin-left:auto">${L.length} registros</span></div>
 ${L.length?`<table><tr><th>Fecha</th><th>Tipo</th><th>Prenda</th><th>Proveedor / Cliente</th><th class="r">Cant.</th><th class="r">P. unit.</th><th class="r">Total</th><th></th></tr>${L.map(m=>`<tr><td>${m.date}</td><td><span class="tag ${m.type==='venta'?'v':'c'}">${m.type}</span></td><td>${esc(pname(prod(m.pid)))}</td><td>${esc(m.party)}</td><td class="r">${m.qty}</td><td class="r">${money(m.unit)}</td><td class="r"><b>${money(m.qty*m.unit)}</b></td><td class="r"><button class="btn s d" onclick="delMove('${m.id}')">✕</button></td></tr>`).join('')}</table>`:empty('Tu historial está vacío','Registra una compra para sumar existencias o una venta para descontarlas.',mBtns)}</div>`},

analisis(){
 const per=window.per||'30',lim=per==='todo'?'0000-00-00':(()=>{const d=new Date();d.setDate(d.getDate()-(+per-1));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
 const S=sales().filter(m=>m.date>=lim),C=db.moves.filter(m=>m.type==='compra'&&m.date>=lim);
 const ing=S.reduce((a,m)=>a+m.qty*m.unit,0),cos=S.reduce((a,m)=>a+m.qty*(m.cost??prod(m.pid)?.cost??0),0),gan=ing-cos,und=S.reduce((a,m)=>a+m.qty,0),gas=C.reduce((a,m)=>a+m.qty*m.unit,0);
 const agg={};S.forEach(m=>{const a=agg[m.pid]||(agg[m.pid]={pid:m.pid,u:0,i:0,g:0});a.u+=m.qty;a.i+=m.qty*m.unit;a.g+=m.qty*(m.unit-(m.cost??prod(m.pid)?.cost??0))});
 const top=Object.values(agg).sort((a,b)=>b.u-a.u||b.i-a.i).slice(0,10),mx=top[0]?.u||1;
 const key=per==='todo'?m=>m.date.slice(0,7):m=>m.date,byD={};S.forEach(m=>byD[key(m)]=(byD[key(m)]||0)+m.qty*m.unit);
 const ks=Object.keys(byD).sort().slice(-31),mv=Math.max(1,...ks.map(k=>byD[k])),bw=Math.min(40,640/Math.max(ks.length,1)-6);
 const chart=ks.length?`<svg viewBox="0 0 680 220" style="width:100%"><line x1="20" x2="670" y1="180" y2="180" stroke="#e6e2d6"/>${ks.map((k,i)=>{const h=byD[k]/mv*150,x=30+i*(640/ks.length);return `<rect x="${x}" y="${180-h}" width="${bw}" height="${h}" rx="4" fill="#2a6a54"><title>${k}: ${money(byD[k])}</title></rect><text x="${x+bw/2}" y="198" font-size="9" text-anchor="middle" fill="#7b8780">${k.slice(per==='todo'?2:5)}</text>`}).join('')}<text x="20" y="14" font-size="11" fill="#7b8780">Máx: ${money(mv)}</text></svg>`:empty('Sin ventas en este periodo','Registra ventas para ver la gráfica.');
 const cat={};S.forEach(m=>{const c=prod(m.pid)?.cat||'Sin categoría';cat[c]=(cat[c]||0)+m.qty*m.unit});const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]),cm=cs[0]?.[1]||1;
 const dead=db.products.filter(p=>!agg[p.id]&&p.stock>0).slice(0,6);
 return head('Análisis / ventas','Análisis y Top','Qué se vende, cuánto ganas y qué prendas lideran tu inventario.',`<select style="width:auto" onchange="per=this.value;render()"><option value="7" ${per==='7'?'selected':''}>Últimos 7 días</option><option value="30" ${per==='30'?'selected':''}>Últimos 30 días</option><option value="365" ${per==='365'?'selected':''}>Último año</option><option value="todo" ${per==='todo'?'selected':''}>Todo</option></select> <button class="btn" onclick="csv()">⬇ Exportar CSV</button> <button class="btn" onclick="print()">🖨 Imprimir</button>`)+
 `<div class="grid"><div class="card kpi"><span class="mu">Ingresos por ventas</span><b>${money(ing)}</b><span class="mu">${und} unidades vendidas</span></div><div class="card kpi ${gan>=0?'pos':'neg'}"><span class="mu">Ganancia bruta</span><b>${money(gan)}</b><span class="mu">${ing?(gan/ing*100).toFixed(1):0}% de margen</span></div><div class="card kpi"><span class="mu">Gasto en compras</span><b>${money(gas)}</b><span class="mu">${C.length} compras</span></div><div class="card kpi"><span class="mu">Ticket promedio</span><b>${money(S.length?ing/S.length:0)}</b><span class="mu">${S.length} ventas</span></div></div>
 <div class="g2"><div class="card"><h3>Ventas ${per==='todo'?'por mes':'por día'}</h3><span class="mu">Ingresos en soles</span>${chart}</div>
 <div class="card"><h3>🏆 Top prendas más vendidas</h3><span class="mu">Por unidades vendidas</span>${top.length?top.map((a,i)=>`<div class="rank"><span class="n">${i+1}</span><div><b>${esc(pname(prod(a.pid)))}</b><div class="mu">${money(a.i)} · ganancia ${money(a.g)}</div><div class="bar"><i style="width:${a.u/mx*100}%"></i></div></div><b>${a.u} u.</b></div>`).join(''):empty('Aún sin datos','Registra ventas para ver tu ranking.')}</div></div>
 <div class="g2"><div class="card"><h3>Ventas por categoría</h3>${cs.length?cs.map(([c,v])=>`<div class="rank" style="grid-template-columns:1fr auto"><div>${esc(c)}<div class="bar"><i style="width:${v/cm*100}%"></i></div></div><b>${money(v)}</b></div>`).join(''):'<p class="mu">Sin datos.</p>'}</div>
 <div class="card"><h3>Sin ventas en el periodo</h3><span class="mu">Prendas con stock que no se mueven</span>${dead.length?dead.map(p=>`<div class="rank" style="grid-template-columns:1fr auto"><div>${esc(pname(p))}</div><span class="tag">${p.stock} u.</span></div>`).join(''):'<p class="mu">Todo tu catálogo tuvo ventas 🎉</p>'}</div></div>`}
};

let cur='inicio';
function render(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===cur));$('#v').innerHTML=views[cur]()}
function keep(r){const el=document.activeElement,p=el.selectionStart;render();const n=document.querySelector('.tools input');if(n){n.focus();n.setSelectionRange(p,p)}}
function go(r){cur=r;location.hash=r;render()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.r));
function modal(html){$('#box').innerHTML=html;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

function prodForm(id){
 const p=prod(id)||{code:'',name:'',cat:'',size:'',cost:'',price:'',stock:0,min:3};
 modal(`<h2>${id?'Editar':'Nuevo'} producto</h2><form onsubmit="return saveProd(event,'${id||''}')"><div class="f">
 <label class="w">Nombre de la prenda<input name="name" required value="${esc(p.name)}" placeholder="Ej. Polo básico algodón"></label>
 <label>Código<input name="code" value="${esc(p.code)}"></label><label>Categoría<input name="cat" list="cl" value="${esc(p.cat)}" placeholder="Polos, Jeans..."><datalist id="cl">${[...new Set(db.products.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></label>
 <label>Talla / color<input name="size" value="${esc(p.size)}" placeholder="M · Negro"></label><label>Stock actual<input name="stock" type="number" min="0" value="${p.stock}" ${id?'':''}></label>
 <label>Costo (S/)<input name="cost" type="number" step="0.01" min="0" required value="${p.cost}"></label><label>Precio de venta (S/)<input name="price" type="number" step="0.01" min="0" required value="${p.price}"></label>
 <label class="w">Stock mínimo (aviso de reposición)<input name="min" type="number" min="0" value="${p.min}"></label></div>
 <div class="acts"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Guardar</button></div></form>`)}
function saveProd(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 const o={name:f.name.trim(),code:f.code.trim(),cat:f.cat.trim(),size:f.size.trim(),cost:+f.cost,price:+f.price,stock:+f.stock||0,min:+f.min||0};
 if(id)Object.assign(prod(id),o);else db.products.push({id:uid(),...o});save();closeM();render();return false}
function delProd(id){if(confirm('¿Eliminar este producto? Sus movimientos quedarán en el historial.')){db.products=db.products.filter(p=>p.id!==id);save();render()}}

function moveForm(type){
 if(!db.products.length){alert('Primero agrega al menos un producto.');return go('productos')}
 const v=type==='venta';
 modal(`<h2>${v?'Registrar venta':'Registrar compra'}</h2><form onsubmit="return saveMove(event,'${type}')"><div class="f">
 <label class="w">Prenda<select name="pid" id="mp" onchange="fillPrice('${type}')">${db.products.map(p=>`<option value="${p.id}">${esc(pname(p))} — stock ${p.stock}</option>`).join('')}</select></label>
 <label>Cantidad<input name="qty" type="number" min="1" value="1" required></label><label>${v?'Precio de venta':'Costo unitario'} (S/)<input name="unit" id="mu" type="number" step="0.01" min="0" required></label>
 <label>${v?'Cliente':'Proveedor'}<input name="party" placeholder="Opcional"></label><label>Fecha<input name="date" type="date" value="${today()}" required></label></div>
 <div class="acts"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Guardar</button></div></form>`);fillPrice(type)}
function fillPrice(t){const p=prod($('#mp').value);$('#mu').value=t==='venta'?p.price:p.cost}
function saveMove(e,type){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p=prod(f.pid),q=+f.qty;
 if(type==='venta'&&q>p.stock&&!confirm(`Solo hay ${p.stock} en stock. ¿Registrar igual?`))return false;
 db.moves.push({id:uid(),type,pid:p.id,qty:q,unit:+f.unit,party:f.party.trim(),date:f.date,cost:p.cost});
 if(type==='venta')p.stock-=q;else{p.stock+=q;p.cost=+f.unit}
 save();closeM();render();return false}
function delMove(id){const m=db.moves.find(x=>x.id===id);if(!confirm('¿Eliminar movimiento? El stock se revertirá.'))return;
 const p=prod(m.pid);if(p)p.stock+=m.type==='venta'?m.qty:-m.qty;db.moves=db.moves.filter(x=>x.id!==id);save();render()}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){const r=[['Fecha','Tipo','Prenda','Cliente/Proveedor','Cantidad','Precio unit','Total']];
 db.moves.forEach(m=>r.push([m.date,m.type,pname(prod(m.pid)),m.party,m.qty,m.unit,(m.qty*m.unit).toFixed(2)]));
 dl('movimientos.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
function backup(){dl('respaldo-inventario-'+today()+'.json',JSON.stringify(db),'application/json')}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.moves)throw 0;if(confirm('Esto reemplazará tus datos actuales. ¿Continuar?')){db=d;save();render()}}catch(e){alert('Archivo no válido')}};r.readAsText(i.files[0])};i.click()}

cur=(location.hash||'#inicio').slice(1);if(!views[cur])cur='inicio';render();
</script></body></html>
